<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>allrecorder by akiraku</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 360px;
      min-height: 480px;
      background-color: #dbe7f3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: #334155;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.08);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-svg {
      width: 24px;
      height: 24px;
      fill: #5b9aa5;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #334155;
    }

    .user-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #5b9aa5;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    .screen-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .is-hidden {
      display: none !important;
    }

    .master-button-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .pulse-wave {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background-color: rgba(224, 86, 86, 0.28);
      opacity: 0;
      pointer-events: none;
    }

    .recording .pulse-wave {
      animation: pulse-ring-keyframes 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring-keyframes {
      0% {
        transform: scale(0.85);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    .outer-concentric-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: #5b9aa5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(91, 154, 165, 0.35);
      transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
    }

    .outer-concentric-circle:hover {
      transform: scale(1.02);
    }

    .outer-concentric-circle:active {
      transform: scale(0.98);
    }

    .recording .outer-concentric-circle {
      background-color: #e05656;
      box-shadow: 0 8px 24px rgba(224, 86, 86, 0.4);
    }

    .middle-concentric-ring {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background-color: #eef4f9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .inner-control-shape {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: #5b9aa5;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .recording .inner-control-shape {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: #e05656;
    }

    .recording-prompt-text {
      font-size: 14px;
      font-weight: 500;
      color: #475569;
      text-align: center;
      line-height: 1.4;
      max-width: 250px;
    }

    .digital-timer {
      font-size: 28px;
      font-weight: 700;
      color: #e05656;
      margin-top: 12px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }

    .editor-card {
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(51, 65, 85, 0.08);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      outline: none;
    }

    .range-controls-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 4px;
    }

    .range-unit {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .range-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
    }

    .time-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #5b9aa5;
      font-weight: 700;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-moz-range-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #e2e8f0;
      border-radius: 3px;
    }

    input[type=range]::-moz-range-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #5b9aa5;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .editor-actions-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 8px;
    }

    .action-btn-primary {
      width: 100%;
      padding: 14px;
      background-color: #5b9aa5;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(91, 154, 165, 0.3);
      transition: background-color 0.2s, transform 0.1s;
    }

    .action-btn-primary:hover {
      background-color: #4f8791;
    }

    .action-btn-primary:active {
      transform: scale(0.99);
    }

    .action-btn-primary:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    .action-btn-secondary {
      width: 100%;
      padding: 12px;
      background-color: transparent;
      color: #64748b;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .action-btn-secondary:hover {
      background-color: #f1f5f9;
      color: #334155;
    }

    .encoding-status-label {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-group">
      <svg class="brand-svg" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
      </svg>
      <span class="brand-name">allrecorder by akiraku</span>
    </div>
    <div class="user-badge">AI</div>
  </header>

  <main>
    <div id="recordingScreen" class="screen-panel">
      <div id="masterButtonWrapper" class="master-button-wrapper">
        <div class="pulse-wave"></div>
        <div id="masterRecordTrigger" class="outer-concentric-circle">
          <div class="middle-concentric-ring">
            <div class="inner-control-shape"></div>
          </div>
        </div>
      </div>
      <div id="statusInstruction" class="recording-prompt-text">Нажмите, чтобы начать запись звука вкладки</div>
      <div id="activeTimerView" class="digital-timer is-hidden">00:00</div>
    </div>

    <div id="editingScreen" class="screen-panel is-hidden">
      <div class="editor-card">
        <audio id="playbackAudio" controls></audio>
        <div class="range-controls-container">
          <div class="range-unit">
            <div class="range-label-row">
              <span>Начало</span>
              <span id="startCutDisplay" class="time-badge">00:00.00</span>
            </div>
            <input type="range" id="startCutSlider" min="0" max="100" value="0" step="0.01">
          </div>
          <div class="range-unit">
            <div class="range-label-row">
              <span>Конец</span>
              <span id="endCutDisplay" class="time-badge">00:00.00</span>
            </div>
            <input type="range" id="endCutSlider" min="0" max="100" value="100" step="0.01">
          </div>
        </div>
      </div>
      <div class="editor-actions-group">
        <button id="downloadMp3Trigger" class="action-btn-primary">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          Скачать в MP3 (320 kbps)
        </button>
        <button id="resetSessionTrigger" class="action-btn-secondary">Записать заново</button>
        <div id="conversionStatus" class="encoding-status-label is-hidden">Идет кодирование MP3 320 kbps...</div>
      </div>
    </div>
  </main>

  <script src="lame.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
