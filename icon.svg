<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a8b96"/>
      <stop offset="100%" stop-color="#2d5860"/>
    </linearGradient>
  </defs>

  <!-- Скругленный фон под стиль расширения -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

  <!-- Графика записи: звуковые дуги и красный индикатор REC -->
  <g transform="translate(0, -6)">
    <!-- Внешние звуковые волны -->
    <path d="M 36 42 A 26 26 0 0 0 36 66" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 92 42 A 26 26 0 0 1 92 66" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Внутренние волны -->
    <path d="M 45 46 A 16 16 0 0 0 45 62" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 83 46 A 16 16 0 0 1 83 62" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Центральный индикатор записи -->
    <circle cx="64" cy="54" r="14" fill="#ffffff"/>
    <circle cx="64" cy="54" r="8" fill="#e05656"/>
  </g>

  <!-- Контрастная подложка под надпись -->
  <rect x="10" y="86" width="108" height="26" rx="8" fill="rgba(15, 23, 42, 0.45)"/>

  <!-- Название allrecorder -->
  <text 
    x="64" 
    y="104" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="14.5" 
    font-weight="900" 
    letter-spacing="0.8px" 
    fill="#ffffff" 
    text-anchor="middle">allrecorder</text>
</svg>
